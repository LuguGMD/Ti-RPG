name: Changelog Generator

on:
  push:
    branches:
      - main
      - development

jobs:
  build-changelog:
    runs-on: ubuntu-latest

    steps:

    - name: Code Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Generating Changelog
      shell: python
      run: |
        import subprocess
        import sys

        categories_names = ["feat", "style", "fix", "refactor", "core", "other"]

        categories = {
            "feat": [],
            "fix": [],
            "style": [],
            "refactor": [],
            "core": [],
            "other": []
        }

        descriptions = {
            "feat": "New Feature",
            "fix": "Fixes",
            "style": "Art Addition",
            "refactor": "Refactoring",
            "core": "Core",
            "other": "Other Changes"
        }

        # Todos os commits do projeto
        cmd = [
            "git",
            "log",
            "--pretty=format:%s"
        ]

        process = subprocess.run(
            cmd,
            stdout=subprocess.PIPE,
            stderr=subprocess.PIPE,
            text=True
        )

        if process.returncode != 0:
            print("Erro ao obter os commits:")
            print(process.stderr)
            sys.exit(1)

        commits = process.stdout.splitlines()

        if not commits:
            print("Nenhum commit encontrado.")
            with open("CHANGELOG_RELEASE.md", "w", encoding="utf-8") as f:
                f.write("# Changes\n\nNo changes detected.")
            sys.exit(0)

        for commit in commits:
            if not commit:
                continue

            lower_commit = commit.lower().strip()
            added = False

            for category in categories_names:
                if lower_commit.startswith(category):
                    categories[category].append(commit)
                    added = True
                    break

            if not added:
                categories["other"].append(commit)

        with open("CHANGELOG_RELEASE.md", "w", encoding="utf-8") as f:
            f.write("# Changes\n\n")

            for category in categories_names:
                f.write(f"## {descriptions[category]}\n\n")

                for item in categories[category]:
                    f.write(f"- {item}\n")

                f.write("\n")

        print(f"Changelog gerado com sucesso! {len(commits)} commits encontrados.")

    - name: Uploading Changelog
      uses: actions/upload-artifact@v4
      with:
        name: Release-Notes
        path: CHANGELOG_RELEASE.md
